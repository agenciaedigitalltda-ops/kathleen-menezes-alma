<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>ALMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/style.css?v=202611121800">
  <link rel="stylesheet" href="assets/venda.css?v=202611121800">
</head>
<body class="venda-page">
  <main id="pagina"></main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></symbol>
  </svg>

  <p class="load-fail" id="load-fail" hidden>Não foi possível carregar os arquivos da pasta <b>assets/</b>. Confira se ela foi enviada junto com as páginas e abra a página em um navegador normal.</p>
  <script>setTimeout(function(){ if(!window.LP||!window.APP_CONFIG){ var e=document.getElementById('load-fail'); e.hidden=false; e.style.cssText='font:16px/1.5 system-ui,sans-serif;max-width:480px;margin:40px auto;padding:16px;border:1px solid #d33;border-radius:10px;color:#222;background:#fff'; } }, 1500);</script>
  <script src="assets/config.js?v=202611121800"></script>
  <script src="assets/common.js?v=202611121800"></script>
  <script>
    (function () {
      var LP = window.LP, C = LP.config, el = LP.el, V = C.venda || {};
      var G = (C.formularios || {})[(C.ensaiosAtivos || [])[0]] || {}, BV = G.boasVindas || {};
      LP.boot();
      document.title = V.tituloAba || C.negocio.nome || 'Início';

      var root = document.getElementById('pagina');
      var wa = LP.waLink(C.negocio.whatsapp, V.mensagemWhatsapp);
      var leadId = 'V' + Date.now().toString(36).toUpperCase();
      var eventoNome = G.nome || C.negocio.nome || 'WhatsApp';

      // link de WhatsApp: dispara Contact (common.js) e Lead no Pixel
      var revisao = !wa && V.revisao === true;   // sem WhatsApp: botões só de exibição (não abrem nada)
      function botaoWa(classe, conteudo, origem) {
        if (!wa && !revisao) return null;
        return el('a', {
          class: classe, href: wa || '#', target: wa ? '_blank' : null, rel: wa ? 'noopener' : null, 'data-wa': wa ? origem : null,
          onclick: function (e) {
            if (!wa) { e.preventDefault(); return; }
            LP.track('Lead', { content_name: eventoNome }, leadId);
          }
        }, conteudo);
      }
      function iconeWa() {
        var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        s.setAttribute('aria-hidden', 'true');
        s.innerHTML = '<use href="#i-wa"/>';
        return s;
      }

      /* ----- 1. Abertura ----- */
      var central = BV.fotoCentral; if (typeof central === 'string') central = { src: central };
      var heroBtn = botaoWa('btn btn-primary btn-lg', [iconeWa(), V.botao || 'Quero essa experiência'], 'hero');
      var hero = el('section', { class: 'step step-welcome welcome-cover welcome-center v-hero' }, [
        central ? el('img', { class: 'wc-photo wc-center', src: central.src, alt: '', fetchpriority: 'high', style: central.foco ? 'object-position:' + central.foco : null }) : null,
        el('div', { class: 'wc-content' }, [
          el('div', { class: 'brand', 'data-brand': true }),
          el('h1', { class: 'w-title', 'data-fit': true, text: BV.titulo || '' }),
          BV.assinatura ? el('p', { class: 'w-byline', text: BV.assinatura }) : null,
          heroBtn ? el('div', { class: 'actions' }, [heroBtn]) : null
        ])
      ]);
      root.appendChild(hero);

      /* ----- 2. Faixa passando ----- */
      var frases = (V.faixa || []).filter(Boolean);
      if (frases.length) {
        var meio = [], n = 0;
        while (meio.length < 14) { meio.push(frases[n % frases.length]); n++; }
        var itens = meio.concat(meio).map(function (t) { return el('span', { class: 'it', text: t }); });
        root.appendChild(el('div', { class: 'v-faixa', 'aria-hidden': 'true' }, [el('div', { class: 'v-faixa-track' }, itens)]));
      }

      /* ----- 3. Apresentação da fotógrafa ----- */
      var F = V.fotografa || {};
      var fotoBox = el('div', { class: 'v-sobre-foto' + (F.foto ? '' : ' vazio') });
      if (F.foto) fotoBox.appendChild(el('img', { src: F.foto, alt: F.titulo || C.negocio.nome || '', loading: 'lazy' }));
      else fotoBox.innerHTML = '<div><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Foto da ' + (C.negocio.responsavel || 'fotógrafa') + '</div>';
      root.appendChild(el('section', { class: 'v-sobre' }, [
        fotoBox,
        el('div', {}, [
          F.selo ? el('p', { class: 'v-eyebrow', text: F.selo }) : null,
          F.titulo ? el('h2', { class: 'v-titulo', text: F.titulo }) : null,
          F.texto ? el('p', { class: 'v-texto', text: F.texto }) : null
        ])
      ]));

      /* ----- 4. Carrossel de fotos ----- */
      var fotos = ((C.apresentacao || {}).fotos || []).filter(Boolean).map(function (f) { return typeof f === 'string' ? f : f.src; });
      var K = V.carrossel || {};
      if (fotos.length) {
        var box = el('div', { class: 'v-car' }, [
          el('div', { class: 'janela' }, [el('div', { class: 'trilho' })]),
          el('div', { class: 'ctrl' }, [
            el('div', { class: 'pontos' }),
            el('div', { class: 'setas' }, [
              el('button', { type: 'button', 'data-ant': true, 'aria-label': 'Anterior' }),
              el('button', { type: 'button', 'data-prox': true, 'aria-label': 'Próxima' })
            ])
          ])
        ]);
        box.querySelector('[data-ant]').innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>';
        box.querySelector('[data-prox]').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8.6 16.6L10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>';
        root.appendChild(el('section', { class: 'v-fotos' }, [
          el('div', { class: 'v-fotos-topo' }, [
            K.selo ? el('p', { class: 'v-eyebrow', text: K.selo }) : null,
            K.titulo ? el('h2', { class: 'v-titulo', text: K.titulo, style: 'margin:0' }) : null
          ]),
          box
        ]));
        carrossel(box, fotos.map(function (src, i) { return '<div><img src="' + src + '" alt="Ensaio ' + (i + 1) + '" draggable="false"></div>'; }),
          { intervalo: (K.segundos || 3.5) * 1000, velocidade: 500 });
      }

      /* ----- 5. Chamada final ----- */
      var fimBtn = botaoWa('btn btn-primary btn-lg', [iconeWa(), V.botao || 'Quero essa experiência'], 'fim');
      if (fimBtn) {
        var Fim = V.fim || {};
        root.appendChild(el('section', { class: 'v-fim' }, [
          Fim.titulo ? el('h2', { class: 'v-titulo', text: Fim.titulo }) : null,
          Fim.texto ? el('p', { class: 'v-texto', text: Fim.texto }) : null,
          fimBtn
        ]));
      }

      /* ----- 6. Botão flutuante (aparece depois que o botão da abertura sai da tela) ----- */
      if (wa || revisao) {
        var flut = botaoWa('v-flutuante', [iconeWa(), V.botaoFlutuante || 'Falar no WhatsApp'], 'flutuante');
        document.body.appendChild(flut);
        if (heroBtn && 'IntersectionObserver' in window) {
          new IntersectionObserver(function (es) { flut.classList.toggle('on', !es[0].isIntersecting); }).observe(heroBtn);
        } else flut.classList.add('on');
      }

      LP.renderBrand(root);
      LP.fitText(root.querySelectorAll('[data-fit]'));
      window.addEventListener('resize', function () { LP.fitText(root.querySelectorAll('[data-fit]')); });
      LP.track('ViewContent', { content_name: eventoNome });

      /* Carrossel infinito (passa sozinho, setas, pontos e arrastar no celular) */
      function carrossel(box, itensHtml, o) {
        var janela = box.querySelector('.janela'), trilho = box.querySelector('.trilho'), pontos = box.querySelector('.pontos');
        var TOTAL = itensHtml.length, vis = 1, indice = 0, animando = false, timer = null;
        function calcVis() { return parseInt(getComputedStyle(box).getPropertyValue('--vis')) || 1; }
        function passo() { return trilho.children[0].offsetWidth + 16; }
        function real() { return (((indice - vis) % TOTAL) + TOTAL) % TOTAL; }
        function aplicar(animar) {
          trilho.style.transition = animar ? 'transform ' + o.velocidade + 'ms ease' : 'none';
          trilho.style.transform = 'translate3d(-' + (indice * passo()) + 'px,0,0)';
          if (!animar) void trilho.offsetHeight;
        }
        function marca() { var r = real(); for (var k = 0; k < pontos.children.length; k++) pontos.children[k].classList.toggle('on', k === r); }
        function montar() {
          vis = calcVis(); var h = [], i;
          for (i = TOTAL - vis; i < TOTAL; i++) h.push(itensHtml[((i % TOTAL) + TOTAL) % TOTAL]);
          for (i = 0; i < TOTAL; i++) h.push(itensHtml[i]);
          for (i = 0; i < vis; i++) h.push(itensHtml[i % TOTAL]);
          trilho.innerHTML = h.join(''); indice = vis; aplicar(false); marca();
        }
        function ir(novo) { if (animando) return; animando = true; indice = novo; aplicar(true); marca(); }
        trilho.addEventListener('transitionend', function (e) {
          if (e.target !== trilho) return;
          if (indice >= TOTAL + vis) { indice -= TOTAL; aplicar(false); } else if (indice < vis) { indice += TOTAL; aplicar(false); }
          animando = false; marca();
        });
        function iniciar() { parar(); timer = setInterval(function () { ir(indice + 1); }, o.intervalo); }
        function parar() { clearInterval(timer); timer = null; }
        box.addEventListener('mouseenter', parar); box.addEventListener('mouseleave', iniciar);
        for (var i = 0; i < TOTAL; i++) (function (i) {
          var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Ir para a foto ' + (i + 1));
          b.onclick = function () { if (vis + i !== indice) ir(vis + i); }; pontos.appendChild(b);
        })(i);
        box.querySelector('[data-ant]').onclick = function () { ir(indice - 1); };
        box.querySelector('[data-prox]').onclick = function () { ir(indice + 1); };
        var tx = 0, ty = 0;
        janela.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; parar(); }, { passive: true });
        janela.addEventListener('touchend', function (e) {
          var dx = tx - e.changedTouches[0].clientX, dy = ty - e.changedTouches[0].clientY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) ir(indice + (dx > 0 ? 1 : -1));
          iniciar();
        }, { passive: true });
        var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (animando) return; if (calcVis() !== vis) montar(); else aplicar(false); }, 150); });
        montar(); iniciar();
      }
    })();
  </script>
</body>
</html>
